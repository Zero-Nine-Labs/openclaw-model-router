name: Credential scan

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      base_sha:
        description: Full ancestor commit SHA before the commits to scan
        required: true
        type: string

permissions:
  contents: read

jobs:
  gitleaks:
    name: Scan introduced commits
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out full commit history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned Gitleaks release
        shell: bash
        run: |
          set -euo pipefail
          version='8.30.1'
          archive="$RUNNER_TEMP/gitleaks_${version}_linux_x64.tar.gz"
          curl --fail --location --silent --show-error \
            "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz" \
            --output "$archive"
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  '"$archive" | sha256sum --check --status
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" version
          cat > "$RUNNER_TEMP/gitleaks.toml" <<'TOML'
          title = "Repository CI defaults"
          [extend]
          useDefault = true
          TOML
          mkdir -p "$RUNNER_TEMP/empty-gitleaks-ignore"

      - name: Select commit range
        id: range
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          MANUAL_BASE: ${{ inputs.base_sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == 'workflow_dispatch' ]]; then
            base="$MANUAL_BASE"
          elif [[ "$EVENT_NAME" == 'push' && "$EVENT_BASE" =~ ^0+$ ]]; then
            base="$(git merge-base "origin/$DEFAULT_BRANCH" HEAD 2>/dev/null)"
          else
            base="$EVENT_BASE"
          fi
          if [[ ! "$base" =~ ^[0-9a-fA-F]{40}$ ]] || ! git cat-file -e "${base}^{commit}" >/dev/null 2>&1; then
            echo 'The selected base commit is missing or invalid.'
            exit 2
          fi
          if ! git merge-base --is-ancestor "$base" HEAD >/dev/null 2>&1; then
            echo 'The selected base commit is not an ancestor of this checkout.'
            exit 2
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"

      - name: Scan commits introduced by this change
        shell: bash
        env:
          BASE_SHA: ${{ steps.range.outputs.base }}
        run: |
          set -euo pipefail
          head="$(git rev-parse HEAD)"
          if [[ "$BASE_SHA" == "$head" ]]; then
            echo 'No commits ahead of the selected base.'
            exit 0
          fi
          report="$RUNNER_TEMP/gitleaks-report.json"
          stdout_log="$RUNNER_TEMP/gitleaks-stdout.log"
          stderr_log="$RUNNER_TEMP/gitleaks-stderr.log"
          if "$RUNNER_TEMP/gitleaks" git \
            --config "$RUNNER_TEMP/gitleaks.toml" \
            --gitleaks-ignore-path "$RUNNER_TEMP/empty-gitleaks-ignore" \
            --ignore-gitleaks-allow \
            --log-opts="$BASE_SHA..$head" \
            --report-format json \
            --report-path "$report" \
            --redact=100 \
            --no-banner \
            --no-color \
            --max-target-megabytes 5 \
            --timeout 60 >"$stdout_log" 2>"$stderr_log"; then
            status=0
          else
            status=$?
          fi
          python3 - "$report" "$status" "$stdout_log" "$stderr_log" <<'PY'
          import json
          import re
          import sys
          from pathlib import Path

          report, status = Path(sys.argv[1]), int(sys.argv[2])
          logs = [Path(sys.argv[3]), Path(sys.argv[4])]
          try:
              findings = json.loads(report.read_text())
          except Exception:
              print('Credential scanner did not produce a readable report.')
              raise SystemExit(2)
          finally:
              report.unlink(missing_ok=True)
              for path in logs:
                  path.unlink(missing_ok=True)

          def clean(value):
              return re.sub(r'[^A-Za-z0-9_./:-]', '?', str(value or ''))[:180]

          if not isinstance(findings, list):
              print('Credential scanner returned an unexpected report format.')
              raise SystemExit(2)
          for finding in findings:
              if not isinstance(finding, dict):
                  print('Credential scanner returned an unexpected finding record.')
                  raise SystemExit(2)
              line = finding.get('StartLine')
              line = line if isinstance(line, int) and line > 0 else '?'
              print('{} at {}:{} (commit {})'.format(
                  clean(finding.get('RuleID')),
                  clean(finding.get('File')),
                  line,
                  clean(finding.get('Commit'))[:12],
              ))
          if status not in (0, 1):
              print('Credential scanner failed with status {}.'.format(status))
              raise SystemExit(2)
          if findings or status == 1:
              raise SystemExit(1)
          PY
